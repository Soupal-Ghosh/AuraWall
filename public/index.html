<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- FIX: SEO meta tags -->
    <title>AuraWall — AI Wallpaper Generator & Gallery</title>
    <meta name="description" content="Discover and download stunning wallpapers, or create your own with AI. Powered by Unsplash, Pexels, Pixabay and Stable Diffusion." />

    <!-- FIX: Open Graph tags (for link previews on WhatsApp, LinkedIn etc) -->
    <meta property="og:title" content="AuraWall — AI Wallpaper Generator" />
    <meta property="og:description" content="Browse thousands of wallpapers or generate your own with AI." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://aurawall.onrender.com" />

    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <div class="wrapHeader">
        <div class="Name">
          <h1>AuraWall</h1>
        </div>

        <!-- FIX: Added search button for mobile users who don't know to press Enter -->
        <div class="search-bar">
          <input
            id="searchInput"
            type="text"
            placeholder="Search for Wallpapers..."
            aria-label="Search wallpapers"
          />
          <button id="searchBtn" class="search-btn" aria-label="Search">🔍</button>
        </div>

        <div class="AIcreate">
          <button id="aiCreateBtn" class="slice">
            <span class="text">Create With AI !!</span>
          </button>
        </div>
      </div>
    </header>

    <main>
      <!-- FIX: Loading spinner -->
      <div id="loadingSpinner" class="spinner hidden" aria-live="polite" aria-label="Loading wallpapers">
        <div class="spinner-ring"></div>
        <p>Loading wallpapers...</p>
      </div>

      <!-- FIX: Empty state -->
      <div id="emptyState" class="state-msg hidden">
        <p>😕 No wallpapers found for "<span id="emptyQuery"></span>"</p>
        <p>Try a different search term.</p>
      </div>

      <!-- FIX: Error state -->
      <div id="errorState" class="state-msg hidden">
        <p>⚠️ Something went wrong loading wallpapers.</p>
        <button onclick="retryLoad()" class="retry-btn">Retry</button>
      </div>

      <div class="grid" id="wallpaperGrid"></div>
    </main>

    <!-- Lightbox -->
    <div id="lightbox" class="lightbox hidden" role="dialog" aria-modal="true" aria-label="Wallpaper viewer">
      <!-- FIX: Removed duplicate class="close" on inner img -->
      <span class="close" onclick="closeLightbox()" aria-label="Close">
        <img src="x.png" alt="Close" />
      </span>

      <!-- FIX: CSS now targets .arrow.prev / .arrow.next correctly -->
      <span class="arrow prev" onclick="prevImage()" aria-label="Previous image">❮</span>

      <div class="lightbox-content">
        <img id="lightboxImg" src="" alt="Wallpaper" />
        <div class="lightbox-actions">
          <!-- FIX: Using ID selector now, consistent with JS -->
          <button id="lightboxDownloadBtn" class="slice">
            <span class="text">Download</span>
          </button>
        </div>
      </div>

      <span class="arrow next" onclick="nextImage()" aria-label="Next image">❯</span>
    </div>

    <script src="script.js"></script>
  </body>
</html>
